<iframe
  style="border-radius:12px"
  src="https://open.spotify.com/embed/{{ .Get "type" | default "track" }}/{{ .Get "id" }}?utm_source=generator"
  width="100%"
  height="{{ .Get "height" | default "352" }}"
  frameBorder="0"
  allowfullscreen
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
  loading="lazy">
</iframe>
